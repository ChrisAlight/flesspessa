<!doctype html>
<html>

<head>
    <title>Flesspessa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json">
    <style>
        .scattered-flag {
            position: fixed;
            pointer-events: none;
            z-index: -1;
        }
    </style>
    <script src="dist/bundle.js"></script>
    <script>
        function startGame() {
            const difficulty = document.getElementById('difficulty').value;
            storage.setDifficulty(difficulty);
            window.location.href = `game.html?difficulty=${difficulty}`;
        }
        function addSuperHard() {
            const difficulty = document.getElementById('difficulty');
            if (difficulty.length > 3) {
                return;
            }
            difficulty.options.add(new Option('Super Hard', 'superHard'))
            storage.addPurchase('superHard');
        }
        function addPurchasedDifficulties() {
            const difficultyElement = document.getElementById('difficulty');
            for (const difficulty of ['normal', 'hard', 'superHard']) {
                if (storage.hasPurchase(difficulty)) {
                    difficultyElement.options.add(new Option(difficulty.charAt(0).toUpperCase() + difficulty.slice(1), difficulty));
                }
            }
        }
        
        window.onload = function () {
            App.setUpPage(storage);

            addPurchasedDifficulties();
            const difficulty = storage.getDifficulty();
            if (difficulty) {
                document.getElementById('difficulty').value = difficulty;
            }

            if (!storage.hasPurchase('map')) {
                document.getElementById('mapButton').style.display = 'none';
            }

            if (storage.hasPurchase('flag drag')) {
                const flagDragPlaceholder = document.getElementById('flagDragPlaceholder');
                const flagDragButton = document.createElement('button');
                flagDragButton.innerText = 'Flag Drag';
                flagDragButton.onclick = function () {
                    window.location.href = 'flagDrag.html';
                };
                flagDragPlaceholder.replaceWith(flagDragButton);
            }
        };
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js');
            });
        }
    </script>
</head>

<body class="body-centered">
    <div class="title-container">
        <h1>Flesspessa</h1>
        <div class="tooltip">Fless-pess</div>
    </div>
    <!--
        <select id="mode">
            <option value="single">Single Player</option>
            <option value="multi">Multiplayer</option>
        </select>
        -->
    <select id="difficulty">
        <option value="easy">Easy</option>
    </select>
    <div style="display: flex; align-items: center; gap: 10px;">
        <button id="mapButton" onclick="window.location.href='map.html'">Map</button>
        <img id="medalImg" style="width: 50px; height: 50px;">
    </div>
    <script>
        if (localStorage.getItem('flesspessaMasterAchieved')) {
            document.getElementById('medalImg').src = 'assets/medals/masterMedal.png';
            document.getElementById('medalImg').alt = 'Master Medal';
            document.getElementById('medalImg').title = 'Master Medal';
        } else {
            document.getElementById('medalImg').src = 'assets/medals/flesspessaMedal.png';
            document.getElementById('medalImg').alt = 'Flesspessa Medal';
            document.getElementById('medalImg').title = 'Flesspessa Medal';
        }
    </script>
    <button onclick="startGame()">Start Game</button>
    <button onclick="addSuperHard()">Multi start no</button>
    <button>$10 show extra level</button>
    <button id="resetButton" onclick="if (window.confirm('This will reset your progress. Are you sure you want to reset?')) { storage.reset(); window.location.reload(); }">reset</button>
    <span id="flagDragPlaceholder"></span>
    <div id="coinContainer">
        <div id="coinText">0</div>
        <img id="coin" width="75" src="assets/coin.png">
        <button id="shopImageButton" onclick="window.location.href='shop.html'">Go to shop</button>
    </div>
    
    <img class="scattered-flag" src="assets/non-existantFlags/greenYellowFlag.png" style="width: 150px; top: 10%; left: 5%;">
    <img class="scattered-flag" src="assets/non-existantFlags/yellowRedFlag.png" style="width: 140px; bottom: 15%; left: 10%; transform: rotate(-10deg);">
    <img class="scattered-flag" src="assets/non-existantFlags/yellowWhiteFlag.png" style="width: 130px; bottom: 20%; right: 5%; transform: rotate(25deg);">
    <img class="scattered-flag" src="assets/non-existantFlags/redGreenFlag.png" style="width: 125px; top: 50%; right: 12%; transform: rotate(-15deg);">
</body>

</html>
